version: "20260513.1"
schema: ./models-schema.json
schemaVersion: 1.0.0
vendors:
  - id: qrplabs
    name: QRP Labs
  - id: kenwood
    name: Kenwood
  - id: labs599
    name: Labs 599
  - id: elecraft
    name: Elecraft
hamCatModels:
  qrplabs.qmx:
    protocol: kenwood
    model: qmx
    vendor: qrplabs
    displayName: QMX
    signals:
      rts: none
      dtr: none
    vfoSplitPattern: same-band
    splitControl:
      kind: mode-flag
      command: FT
      splitValue: "2"
      vfoAValue: "0"
      vfoBValue: "1"
      splitRxVfo: A
      splitTxVfo: B

  kenwood.ts590:
    protocol: kenwood
    model: ts590
    vendor: kenwood
    displayName: TS-590
    signals:
      rts: none
      dtr: none
    vfoSplitPattern: any
    txSourceMap:
      MIC: "0"
      DATA: "1"
    extra:
      dataSource:
        hint: TX audio data source selection
        value:
          setCommandPrefix: EX0630000
          sourceMap:
            ACC2: "0"
            USB: "1"

  kenwood.ts480:
    protocol: kenwood
    model: ts480
    vendor: kenwood
    displayName: TS-480
    signals:
      rts: none
      dtr: none
    vfoSplitPattern: any

  kenwood.ts450:
    sameAs: kenwood.ts480
    model: ts450
    vendor: kenwood
    displayName: TS-450

  kenwood.ts690:
    sameAs: kenwood.ts480
    model: ts690
    vendor: kenwood
    displayName: TS-690

  kenwood.ts570:
    sameAs: kenwood.ts480
    model: ts570
    vendor: kenwood
    displayName: TS-570

  kenwood.ts2000:
    sameAs: kenwood.ts480
    model: ts2000
    vendor: kenwood
    displayName: TS-2000

  kenwood.ts880:
    sameAs: kenwood.ts480
    model: ts880
    vendor: kenwood
    displayName: TS-880

  elecraft.kx3:
    sameAs: kenwood.ts480
    model: kx3
    vendor: elecraft
    displayName: KX-3

  elecraft.kx2:
    sameAs: elecraft.kx3
    model: kx2
    vendor: elecraft
    displayName: KX-2

  elecraft.k3:
    sameAs: elecraft.kx3
    model: k3
    vendor: elecraft
    displayName: K3
    # NOTE: K3 can only enter split mode with RX VFO = A (FR0).
    # The standard FR/FT split path does not enforce this; set FR A manually before enabling split.

  elecraft.k2:
    sameAs: elecraft.kx3
    model: k2
    vendor: elecraft
    displayName: K2

  labs599.tx500:
    protocol: kenwood
    model: tx500
    vendor: labs599
    displayName: TX-500
    ptt: rts
    vfoSplitPattern: same-band
